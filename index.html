<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>FOOT LEGEND 3D</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <div id="game-container"></div>

  <div id="loading">
    <h1>FOOT LEGEND</h1>
    <p>Préparation du stade...</p>
  </div>

  <div id="game-ui">

    <div id="scoreboard">
      <span>HOME</span>
      <strong id="score">0 - 0</strong>
      <span>AWAY</span>
    </div>

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div id="actions">
      <button id="pass">PASSE</button>
      <button id="shoot">TIR</button>
      <button id="sprint">COURIR</button>
    </div>

  </div>

  <script type="module" src="main.js"></script>

</body>
</html>
